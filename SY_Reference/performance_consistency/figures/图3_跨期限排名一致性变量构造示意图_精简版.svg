<svg viewBox="0 0 960 410" xmlns="http://www.w3.org/2000/svg" role="img">
<title>跨期限排名一致性变量构造示意图（精简版）</title>
<desc>在同一时点 t，分别用过去 1、3、6 个月的收益窗口计算基金排名（实际变量还包含 m=12 个月窗口，本图从简未画出），再对排名取跨期限标准差与均值。</desc>

<rect x="0" y="0" width="960" height="410" fill="#FBF3E7"/>

<text x="480" y="40" text-anchor="middle" font-size="24" font-weight="700" fill="#8B4A2B" font-family="sans-serif">图3：跨期限排名一致性变量参数构造示意图</text>
<text x="480" y="63" text-anchor="middle" font-size="13" fill="#8A7A66" font-family="sans-serif">（实际变量共 4 个期限：1/3/6/12 个月；为节省版面，本图仅示意 m=1/3/6，公式一致）</text>

<defs>
<marker id="arrowEnd2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
<path d="M0,0 L8,3 L0,6 Z" fill="#333333"/>
</marker>
<marker id="orangeArrow2" markerWidth="10" markerHeight="10" refX="5" refY="3" orient="auto">
<path d="M0,0 L8,3 L0,6 Z" fill="#C2703D"/>
</marker>
<marker id="orangeArrowRev2" markerWidth="10" markerHeight="10" refX="3" refY="3" orient="auto">
<path d="M8,0 L0,3 L8,6 Z" fill="#C2703D"/>
</marker>
</defs>

<!-- timeline axis -->
<line x1="70" y1="100" x2="630" y2="100" stroke="#333333" stroke-width="2" marker-end="url(#arrowEnd2)"/>
<text x="648" y="106" font-size="16" fill="#333333" font-family="sans-serif">时间</text>

<!-- ticks -->
<g font-family="sans-serif" font-size="15" fill="#555555">
<line x1="70" y1="94" x2="70" y2="106" stroke="#333333" stroke-width="2"/>
<text x="70" y="128" text-anchor="middle">t-6</text>

<line x1="310" y1="94" x2="310" y2="106" stroke="#333333" stroke-width="2"/>
<text x="310" y="128" text-anchor="middle">t-3</text>

<line x1="470" y1="94" x2="470" y2="106" stroke="#333333" stroke-width="2"/>
<text x="470" y="128" text-anchor="middle">t-1</text>

<line x1="550" y1="94" x2="550" y2="106" stroke="#333333" stroke-width="2.5"/>
<text x="550" y="128" text-anchor="middle" font-weight="700" fill="#333333">t</text>

<line x1="630" y1="94" x2="630" y2="106" stroke="#333333" stroke-width="2"/>
<text x="630" y="128" text-anchor="middle">t+1</text>
</g>

<!-- bar m=6 -->
<rect x="70" y="150" width="480" height="32" rx="8" fill="#E8C49A"/>
<text x="310" y="171" text-anchor="middle" font-size="15" fill="#4A2E12" font-family="sans-serif">m = 6 个月收益窗口</text>
<circle cx="550" cy="166" r="6" fill="#2F5E5E"/>
<line x1="550" y1="166" x2="660" y2="166" stroke="#3E7A6E" stroke-width="1.5" stroke-dasharray="4,4"/>
<text x="556" y="160" font-size="13" fill="#2F5E5E" font-family="sans-serif">排名(m=6)</text>

<!-- bar m=3 -->
<rect x="310" y="220" width="240" height="32" rx="8" fill="#E8C49A"/>
<text x="430" y="241" text-anchor="middle" font-size="14" fill="#4A2E12" font-family="sans-serif">m = 3 个月窗口</text>
<circle cx="550" cy="236" r="6" fill="#2F5E5E"/>
<line x1="550" y1="236" x2="660" y2="236" stroke="#3E7A6E" stroke-width="1.5" stroke-dasharray="4,4"/>
<text x="556" y="230" font-size="13" fill="#2F5E5E" font-family="sans-serif">排名(m=3)</text>

<!-- bar m=1 -->
<rect x="470" y="290" width="80" height="32" rx="8" fill="#E8C49A"/>
<text x="460" y="311" text-anchor="end" font-size="14" fill="#4A2E12" font-family="sans-serif">m=1 个月窗口</text>
<circle cx="550" cy="306" r="6" fill="#2F5E5E"/>
<line x1="550" y1="306" x2="660" y2="306" stroke="#3E7A6E" stroke-width="1.5" stroke-dasharray="4,4"/>
<text x="556" y="300" font-size="13" fill="#2F5E5E" font-family="sans-serif">排名(m=1)</text>

<!-- bracket -->
<path d="M660,166 L675,166 L675,306 L660,306" fill="none" stroke="#3E7A6E" stroke-width="2"/>
<line x1="675" y1="236" x2="700" y2="236" stroke="#3E7A6E" stroke-width="2"/>

<!-- right side annotation -->
<text x="715" y="215" font-size="20" font-weight="700" fill="#2B2B2B" font-family="sans-serif">rank_count</text>
<text x="715" y="238" font-size="15" fill="#555555" font-family="sans-serif">(n = 4 期)</text>
<text x="715" y="273" font-size="18" font-weight="700" fill="#2F6B4F" font-family="sans-serif">计算跨期限</text>
<text x="715" y="295" font-size="18" font-weight="700" fill="#2F6B4F" font-family="sans-serif">标准差和均值</text>

<!-- bottom horizon arrow -->
<line x1="76" y1="345" x2="544" y2="345" stroke="#C2703D" stroke-width="2" marker-start="url(#orangeArrowRev2)" marker-end="url(#orangeArrow2)"/>
<text x="480" y="368" text-anchor="middle" font-size="14" fill="#8B4A2B" font-family="sans-serif">m = 1 / 3 / 6 个月窗口（均以时点 t 为终点；另有 m=12 个月窗口未画出）</text>

</svg>
