<svg viewBox="0 0 1560 480" xmlns="http://www.w3.org/2000/svg" role="img">
<title>跨期限排名一致性变量构造示意图</title>
<desc>在同一时点 t，分别用过去 1、3、6、12 个月的收益窗口计算基金排名，再对这四个排名取跨期限标准差（rank_vol_across_horizons）和均值（rank_mean_across_horizons）。</desc>

<rect x="0" y="0" width="1560" height="480" fill="#FBF3E7"/>

<text x="700" y="42" text-anchor="middle" font-size="26" font-weight="700" fill="#8B4A2B" font-family="sans-serif">图3：跨期限排名一致性变量参数构造示意图</text>

<defs>
<marker id="arrowEnd" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
<path d="M0,0 L8,3 L0,6 Z" fill="#333333"/>
</marker>
<marker id="orangeArrow" markerWidth="10" markerHeight="10" refX="5" refY="3" orient="auto">
<path d="M0,0 L8,3 L0,6 Z" fill="#C2703D"/>
</marker>
<marker id="orangeArrowRev" markerWidth="10" markerHeight="10" refX="3" refY="3" orient="auto">
<path d="M8,0 L0,3 L8,6 Z" fill="#C2703D"/>
</marker>
</defs>

<!-- timeline axis -->
<line x1="70" y1="100" x2="1150" y2="100" stroke="#333333" stroke-width="2" marker-end="url(#arrowEnd)"/>
<text x="1168" y="106" font-size="16" fill="#333333" font-family="sans-serif">时间</text>

<!-- ticks -->
<g font-family="sans-serif" font-size="15" fill="#555555">
<line x1="70" y1="94" x2="70" y2="106" stroke="#333333" stroke-width="2"/>
<text x="70" y="128" text-anchor="middle">t-12</text>

<line x1="555" y1="94" x2="555" y2="106" stroke="#333333" stroke-width="2"/>
<text x="555" y="128" text-anchor="middle">t-6</text>

<line x1="797" y1="94" x2="797" y2="106" stroke="#333333" stroke-width="2"/>
<text x="797" y="128" text-anchor="middle">t-3</text>

<line x1="959" y1="94" x2="959" y2="106" stroke="#333333" stroke-width="2"/>
<text x="959" y="128" text-anchor="middle">t-1</text>

<line x1="1039" y1="94" x2="1039" y2="106" stroke="#333333" stroke-width="2.5"/>
<text x="1039" y="128" text-anchor="middle" font-weight="700" fill="#333333">t</text>

<line x1="1120" y1="94" x2="1120" y2="106" stroke="#333333" stroke-width="2"/>
<text x="1120" y="128" text-anchor="middle">t+1</text>
</g>

<!-- bar m=12 -->
<rect x="70" y="150" width="969" height="32" rx="8" fill="#E8C49A"/>
<text x="554" y="171" text-anchor="middle" font-size="15" fill="#4A2E12" font-family="sans-serif">m = 12 个月收益窗口</text>
<circle cx="1039" cy="166" r="6" fill="#2F5E5E"/>
<line x1="1039" y1="166" x2="1155" y2="166" stroke="#3E7A6E" stroke-width="1.5" stroke-dasharray="4,4"/>
<text x="1045" y="160" font-size="13" fill="#2F5E5E" font-family="sans-serif">排名(m=12)</text>

<!-- bar m=6 -->
<rect x="555" y="220" width="484" height="32" rx="8" fill="#E8C49A"/>
<text x="797" y="241" text-anchor="middle" font-size="15" fill="#4A2E12" font-family="sans-serif">m = 6 个月收益窗口</text>
<circle cx="1039" cy="236" r="6" fill="#2F5E5E"/>
<line x1="1039" y1="236" x2="1155" y2="236" stroke="#3E7A6E" stroke-width="1.5" stroke-dasharray="4,4"/>
<text x="1045" y="230" font-size="13" fill="#2F5E5E" font-family="sans-serif">排名(m=6)</text>

<!-- bar m=3 -->
<rect x="797" y="290" width="242" height="32" rx="8" fill="#E8C49A"/>
<text x="918" y="311" text-anchor="middle" font-size="14" fill="#4A2E12" font-family="sans-serif">m=3 个月窗口</text>
<circle cx="1039" cy="306" r="6" fill="#2F5E5E"/>
<line x1="1039" y1="306" x2="1155" y2="306" stroke="#3E7A6E" stroke-width="1.5" stroke-dasharray="4,4"/>
<text x="1045" y="300" font-size="13" fill="#2F5E5E" font-family="sans-serif">排名(m=3)</text>

<!-- bar m=1 -->
<rect x="959" y="360" width="80" height="32" rx="8" fill="#E8C49A"/>
<text x="949" y="381" text-anchor="end" font-size="14" fill="#4A2E12" font-family="sans-serif">m=1 个月窗口</text>
<circle cx="1039" cy="376" r="6" fill="#2F5E5E"/>
<line x1="1039" y1="376" x2="1155" y2="376" stroke="#3E7A6E" stroke-width="1.5" stroke-dasharray="4,4"/>
<text x="1045" y="370" font-size="13" fill="#2F5E5E" font-family="sans-serif">排名(m=1)</text>

<!-- bracket -->
<path d="M1155,166 L1170,166 L1170,376 L1155,376" fill="none" stroke="#3E7A6E" stroke-width="2"/>
<line x1="1170" y1="271" x2="1195" y2="271" stroke="#3E7A6E" stroke-width="2"/>

<!-- right side annotation -->
<text x="1200" y="250" font-size="21" font-weight="700" fill="#2B2B2B" font-family="sans-serif">rank_count</text>
<text x="1200" y="273" font-size="15" fill="#555555" font-family="sans-serif">(n = 4 期，m = 1/3/6/12月)</text>
<text x="1200" y="308" font-size="18" font-weight="700" fill="#2F6B4F" font-family="sans-serif">计算跨期限</text>
<text x="1200" y="330" font-size="18" font-weight="700" fill="#2F6B4F" font-family="sans-serif">标准差和均值</text>

<!-- bottom horizon arrow spanning full range -->
<line x1="76" y1="415" x2="1033" y2="415" stroke="#C2703D" stroke-width="2" marker-start="url(#orangeArrowRev)" marker-end="url(#orangeArrow)"/>
<text x="554" y="440" text-anchor="middle" font-size="15" fill="#8B4A2B" font-family="sans-serif">m = 1 / 3 / 6 / 12 个月（同一时点 t 起算的四种收益窗口长度）</text>

</svg>
